name: solo101-wrapdesk
services:
  desk:
    build:
      context: .
      args:
        WRAPDESK_RUNTIME_IMAGE: ${WRAPDESK_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${WRAPDESK_IMAGE:-solo101-wrapdesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${WRAPDESK_PORT:-19901}:8000"
    volumes:
      - wrap-data:/var/lib/wrapdesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/wrapdesk/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  wrap-data:
